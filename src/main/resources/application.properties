# Application Name
spring.application.name=diancan2

# DataSource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/diancan
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis-Plus Configuration
mybatis-plus.mapper-locations=classpath:/mapper/**/*.xml
mybatis-plus.global-config.db-config.id-type=auto

# Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/,file:./frontend/dist/

# Schema Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ??/??????
# Windows ?????????????? C:\Users\<user>\diancan\uploads\images
app.upload-dir=D:/data/diancan/images
# ????????????
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
