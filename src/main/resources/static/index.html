<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点餐系统后台</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            padding: 20px;
        }
    </style>
</head>
<body>

<div id="app">
    <h1>点餐系统后台</h1>
    <n-tabs type="line" animated>
        <n-tab-pane name="seat-management" tab="座位管理">
            <n-h2>座位列表</n-h2>
            <n-button @click="showAddModal = true" type="primary" style="margin-bottom: 20px;">添加座位</n-button>
            <n-data-table
                :columns="seatColumns"
                :data="seats"
                :pagination="false"
                :bordered="false"
            />
        </n-tab-pane>
        <n-tab-pane name="food-management" tab="菜单管理">
            <n-h2>菜单管理</n-h2>
            <p>菜单管理功能待实现。</p>
        </n-tab-pane>
        <n-tab-pane name="order-management" tab="订单管理">
            <n-h2>订单管理</n-h2>
            <p>订单管理功能待实现。</p>
        </n-tab-pane>
    </n-tabs>

    <!-- 添加座位 Modal -->
    <n-modal v-model:show="showAddModal">
        <n-card
            style="width: 600px"
            title="添加新座位"
            :bordered="false"
            size="huge"
            role="dialog"
            aria-modal="true"
        >
            <n-form>
                <n-form-item label="座位号">
                    <n-input v-model:value="newSeat.seatNumber" placeholder="输入座位号" />
                </n-form-item>
                <n-form-item label="容量">
                    <n-input-number v-model:value="newSeat.capacity" :min="1" />
                </n-form-item>
            </n-form>
            <template #footer>
                <n-button @click="addSeat" type="primary">确认</n-button>
                <n-button @click="showAddModal = false">取消</n-button>
            </template>
        </n-card>
    </n-modal>

</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/naive-ui"></script>
<script>
    const { createApp, ref, onMounted, h } = Vue;
    const { NButton } = naive;

    const app = createApp({
        setup() {
            const seats = ref([]);
            const showAddModal = ref(false);
            const newSeat = ref({
                seatNumber: '',
                capacity: 1,
                status: 0,
            });

            const seatColumns = [
                { title: 'ID', key: 'id' },
                { title: '座位号', key: 'seatNumber' },
                { title: '容量', key: 'capacity' },
                {
                    title: '状态',
                    key: 'status',
                    render(row) {
                        const statusMap = { 0: '空闲', 1: '占用', 2: '已预约' };
                        return statusMap[row.status] || '未知';
                    }
                },
                {
                    title: '操作',
                    key: 'actions',
                    render(row) {
                        return h(
                            NButton,
                            {
                                size: 'small',
                                onClick: () => generateQrCode(row.id)
                            },
                            { default: () => '生成二维码' }
                        )
                    }
                }
            ];

            const fetchSeats = async () => {
                try {
                    const response = await fetch('/seat');
                    seats.value = await response.json();
                } catch (error) {
                    console.error('获取座位失败:', error);
                }
            };

            const addSeat = async () => {
                try {
                    await fetch('/seat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newSeat.value)
                    });
                    showAddModal.value = false;
                    fetchSeats(); // Refresh list
                } catch (error) {
                    console.error('添加座位失败:', error);
                }
            };
            
            const generateQrCode = async (id) => {
                try {
                    const response = await fetch(`/seat/qrcode/${id}`);
                    const qrCodeBase64 = await response.text();
                    const qrWindow = window.open("", "QRCode", "width=350,height=350");
                    qrWindow.document.write('<img src="data:image/png;base64,' + qrCodeBase64 + '" />');
                } catch (error) {
                    console.error('生成二维码失败:', error);
                }
            };

            onMounted(fetchSeats);

            return {
                seats,
                seatColumns,
                showAddModal,
                newSeat,
                addSeat,
                generateQrCode
            };
        }
    });

    app.use(naive);
    app.mount('#app');
</script>

</body>
</html>
